spring.application.name=goweb-spring

server.address=0.0.0.0
server.port=8080

grpc.server.port=9090
grpc.server.insecure.cors-enabled=true
grpc.server.insecure.cors-allow-headers=Content-Type
grpc.server.security.enabled=false

# Supabase Authentication Configuration
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
supabase.url=${SUPABASE_URL:}
# The webhook secret should be provided WITHOUT the 'v1,whsec_' prefix
supabase.before-user-created.secret=${SUPABASE_BEFORE_USER_CREATED_SECRET:}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/compose-postgres
spring.datasource.username=compose-postgres
spring.datasource.password=compose-postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.goweb_spring=INFO
logging.level.com.example.goweb_spring.model.GameRoom=DEBUG
logging.level.com.example.goweb_spring.services.GameRoomService=DEBUG
logging.level.com.example.goweb_spring.services.GameTimerManager=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO

# GameTimerManager Configuration
game.timer.thread-pool-size=4