name: Deploy Weiqi.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: |
          cd goweb-spring
          mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: weiqi-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd goweb-spring
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Make sure we’re in the compose directory
            cd /app

            # Log in to ECR
            aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" |
              sudo docker login --username AWS --password-stdin "${{ steps.login-ecr.outputs.registry }}"

            # Update docker-compose.yml to use latest image
            sudo sed -i 's/weiqi-backend:[a-f0-9]\{40\}/weiqi-backend:latest/g' docker-compose.yml
            
            # Pull the latest image
            sudo docker-compose pull          # pulls whatever tags are in docker-compose.yml
            sudo docker-compose up -d         # recreates only if the image changed

  # Push to personal repo and trigger Vercel deployment
  frontend-deploy:
    name: Frontend Deployment
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Push to personal repository
        env:
          PERSONAL_REPO_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
          PERSONAL_REPO_URL: ${{ secrets.PERSONAL_REPO_URL }}
        run: |
          # Hardcode the repository URL directly
          echo "Using hardcoded repository URL..."
          
          # Cleanup any existing remote
          git remote remove personal 2>/dev/null || true
          
          # Add the personal repository as a remote with hardcoded URL
          echo "Adding remote with hardcoded URL..."
          git remote add personal https://${PERSONAL_REPO_TOKEN}@github.com/Lstsk/weiqi-frontend.git
          
          # Check if remote was added successfully
          echo "Remote URLs:"
          git remote -v
          
          # Push with verbosity
          echo "Pushing with verbosity..."
          git push personal HEAD:main -f
          
          echo "Pushed to personal repository. Vercel deployment should be triggered automatically."
