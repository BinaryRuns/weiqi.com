name: Deploy Weiqi.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: |
          cd goweb-spring
          mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: weiqi-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd goweb-spring
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure /app directory exists and we have permissions
            sudo mkdir -p /app
            sudo chown ec2-user:ec2-user /app
            cd /app

            # Update the docker-compose.yml file with the new image
            sudo bash -c 'echo "version: '\''3'\''" > docker-compose.yml'
            sudo bash -c 'echo "services:" >> docker-compose.yml'
            sudo bash -c 'echo "  backend:" >> docker-compose.yml'
            sudo bash -c 'echo "    image: \"${{ steps.login-ecr.outputs.registry }}/weiqi-backend:${{ github.sha }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "    restart: always" >> docker-compose.yml'
            sudo bash -c 'echo "    ports:" >> docker-compose.yml'
            sudo bash -c 'echo "      - \"443:8443\"" >> docker-compose.yml'
            sudo bash -c 'echo "    volumes:" >> docker-compose.yml'
            sudo bash -c 'echo "      - /etc/nginx/ssl:/etc/ssl" >> docker-compose.yml'
            sudo bash -c 'echo "    environment:" >> docker-compose.yml'
            sudo bash -c 'echo "      - SPRING_DATASOURCE_URL=jdbc:postgresql://\"${{ secrets.DB_ENDPOINT }}\":5432/\"${{ secrets.DB_NAME }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SPRING_DATASOURCE_USERNAME=\"${{ secrets.DB_USERNAME }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SPRING_DATASOURCE_PASSWORD=\"${{ secrets.DB_PASSWORD }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SPRING_DATA_REDIS_HOST=\"${{ secrets.REDIS_ENDPOINT }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SPRING_DATA_REDIS_PORT=6379" >> docker-compose.yml'
            sudo bash -c 'echo "      - SPRING_PROFILES_ACTIVE=\"${{ secrets.SPRING_PROFILE }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SUPABASE_JWT_SECRET=\"${{ secrets.SUPABASE_JWT_SECRET }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SERVER_PORT=8443" >> docker-compose.yml'
            sudo bash -c 'echo "      - SERVER_SSL_ENABLED=true" >> docker-compose.yml'
            sudo bash -c 'echo "      - SERVER_SSL_KEY_STORE_TYPE=PKCS12" >> docker-compose.yml'
            sudo bash -c 'echo "      - SERVER_SSL_KEY_STORE=/etc/ssl/keystore.p12" >> docker-compose.yml'
            sudo bash -c 'echo "      - SERVER_SSL_KEY_STORE_PASSWORD=\"${{ secrets.SSL_KEY_STORE_PASSWORD }}\"" >> docker-compose.yml'
            sudo bash -c 'echo "      - SERVER_SSL_KEY_ALIAS=tomcat" >> docker-compose.yml'

            # Fix Docker permissions if needed
            sudo usermod -aG docker ec2-user

            # Pull the new image and restart the container
            aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" | sudo docker login --username AWS --password-stdin "${{ steps.login-ecr.outputs.registry }}"
            sudo docker-compose pull
            sudo docker-compose up -d

  # Frontend deployment is now handled in a separate personal repository
  # This job is kept as a notification step
  frontend-notification:
    name: Frontend Notification
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Notify about backend deployment
        run: |
          echo "Backend deployment completed. Please trigger the frontend deployment in your personal repository."
          echo "Frontend repository should be configured with its own GitHub Actions workflow."
