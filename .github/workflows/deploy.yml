name: Deploy Weiqi.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: |
          cd goweb-spring
          mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: weiqi-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd goweb-spring
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Make sure we’re in the compose directory
            cd /app

            # Log in to ECR
            aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" |
              sudo docker login --username AWS --password-stdin "${{ steps.login-ecr.outputs.registry }}"

            # Pull the latest image (tagged with the commit SHA + latest)
            sudo docker-compose pull          # pulls whatever tags are in docker-compose.yml
            sudo docker-compose up -d         # recreates only if the image changed

  # Frontend deployment is now handled in a separate personal repository
  # This job is kept as a notification step
  frontend-notification:
    name: Frontend Notification
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Notify about backend deployment
        run: |
          echo "Backend deployment completed. Please trigger the frontend deployment in your personal repository."
          echo "Frontend repository should be configured with its own GitHub Actions workflow."
