name: Deploy Weiqi.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: |
          cd goweb-spring
          mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: weiqi-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd goweb-spring
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update the docker-compose.yml file with the new image
            cd /app
            echo "version: '3'" > docker-compose.yml
            echo "services:" >> docker-compose.yml
            echo "  backend:" >> docker-compose.yml
            echo "    image: ${{ steps.login-ecr.outputs.registry }}/weiqi-backend:${{ github.sha }}" >> docker-compose.yml
            echo "    restart: always" >> docker-compose.yml
            echo "    ports:" >> docker-compose.yml
            echo "      - \"80:8080\"" >> docker-compose.yml
            echo "    environment:" >> docker-compose.yml
            echo "      - SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.DB_ENDPOINT }}:5432/${{ secrets.DB_NAME }}" >> docker-compose.yml
            echo "      - SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}" >> docker-compose.yml
            echo "      - SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> docker-compose.yml
            echo "      - SPRING_DATA_REDIS_HOST=${{ secrets.REDIS_ENDPOINT }}" >> docker-compose.yml
            echo "      - SPRING_DATA_REDIS_PORT=6379" >> docker-compose.yml
            echo "      - SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILE }}" >> docker-compose.yml
            echo "      - SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}" >> docker-compose.yml

            # Pull the new image and restart the container
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker-compose pull
            docker-compose up -d

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: goweb/package-lock.json

      - name: Install dependencies
        run: |
          cd goweb
          npm ci

      - name: Build Next.js app
        run: |
          cd goweb
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./goweb
          vercel-args: "--prod"
