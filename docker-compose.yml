services:
  # PostgreSQL Service
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis Service
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app-network

  # Optional: pgAdmin (PostgreSQL Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./goweb
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    volumes:
      - ./goweb:/app
      - /app/node_modules
    networks:
      - app-network

  # Backend Service
  backend:
    build:
      context: ./goweb-spring
      dockerfile: Dockerfile.dev
    container_name: backend
    ports:
      - "${BACKEND_PORT}:8080"
    env_file:
      - .env
    volumes:
      - ./goweb-spring:/app
      - ~/.m2:/root/.m2
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # Ngrok Service for exposing the backend
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: always
    ports:
      - "4040:4040"
    env_file:
      - .env
    command: ["http", "--domain=gentle-moderately-sheepdog.ngrok-free.app", "backend:8080"]
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
